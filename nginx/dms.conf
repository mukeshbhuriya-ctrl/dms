# ─────────────────────────────────────────────────────────────
#  Nginx configuration for DMS — Windows Server (localhost)
#  Place this file at:
#    C:\nginx\conf\nginx.conf   (replace the default conf)
#  OR include it from the main nginx.conf:
#    include "C:/nginx/conf/sites/dms.conf";
# ─────────────────────────────────────────────────────────────

# Worker processes — set to number of CPU cores (or 'auto' on Nginx ≥ 1.9)
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ─── Logging ───────────────────────────────────────────────
    access_log  logs/dms-access.log;
    error_log   logs/dms-error.log;

    # ─── Performance ───────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # ─── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ─── Upstream: PM2 Node.js Backend ─────────────────────────
    upstream dms_backend {
        # PM2 cluster workers all bind to :3001
        server 127.0.0.1:3001;
        keepalive 32;
    }

    # ─── Main Server Block ─────────────────────────────────────
    server {
        listen 80;
        server_name 10.56.2.195;          # Static host IP

        # Max upload size must match MAX_FILE_SIZE in backend .env (1 GB)
        client_max_body_size 1024M;
        client_body_timeout  300s;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;

        # ── 1. Vite Static Build (Frontend) ─────────────────────
        root   D:/DMS/2/frontend/dist;   # ← path to your Vite build output
        index  index.html;

        # SPA fallback: any non-file URL → index.html
        location / {
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ── 2. API Proxy → PM2 Backend ──────────────────────────
        location /api/ {
            proxy_pass         http://dms_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── 3. WebSocket Proxy → PM2 Backend (Notifications) ────
        location /socket.io/ {
            proxy_pass         http://dms_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # ── 4. Health Check (bypass to backend) ─────────────────
        location /health {
            proxy_pass http://dms_backend/health;
        }

        # ── 5. Error Pages ───────────────────────────────────────
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root D:/DMS/2/frontend/dist;
        }
    }
}
